<style>
.engrane-cw { animation: girar-cw 14s linear infinite; transform-origin: 320px 548px; }
.engrane-ccw-2 { animation: girar-ccw 10s linear infinite; transform-origin: 230.4px 433.3px; }
.engrane-ccw-3 { animation: girar-ccw 8s linear infinite; transform-origin: 194.6px 593.7px; }
@keyframes girar-cw { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes girar-ccw { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
.humo { animation: subir 5.5s ease-in-out infinite; }
.humo-2 { animation: subir 6.8s ease-in-out infinite 1.4s; }
@keyframes subir {
  0% { transform: translate(0px, 0px) scale(0.95); opacity: 0.72; }
  50% { transform: translate(12px, -14px) scale(1.06); opacity: 0.5; }
  100% { transform: translate(24px, -26px) scale(1.14); opacity: 0.18; }
}
.banda-linea { stroke-dasharray: 16 14; animation: avanzar 1.8s linear infinite; }
@keyframes avanzar { to { stroke-dashoffset: -30; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

