<style>
.nube { animation: deriva 32s ease-in-out infinite alternate; }
.nube-2 { animation: deriva 40s ease-in-out infinite alternate-reverse; }
@keyframes deriva { from { transform: translateX(-14px); } to { transform: translateX(16px); } }
.gancho { animation: balanceo 5s ease-in-out infinite alternate; transform-origin: 906px 146px; }
@keyframes balanceo { from { transform: rotate(-2.2deg); } to { transform: rotate(2.2deg); } }
.baliza { animation: destello 1.8s ease-in-out infinite; }
@keyframes destello { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

